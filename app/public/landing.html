<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f0e8">
    <meta name="description" content="zixin.space 的个人世界观察公开入口。">
    <title>zixin.space / 公开入口</title>
    <link rel="stylesheet" href="/landing.css">
  </head>
  <body>
    <div class="landing-page">
      <div class="landing-texture" aria-hidden="true"></div>

      <!-- One semantic target covers the viewport. The server decides whether it leads to /app or /login. -->
      <a class="landing-entry" href="/app" aria-label="进入完整观察台">
        <span class="sr-only">进入完整观察台</span>
      </a>

      <header class="landing-header">
        <div class="landing-wordmark" aria-label="zixin.space">
          <span>zixin.space</span>
        </div>
        <p class="header-index">OPEN OBSERVATION ENTRY</p>
      </header>

      <main class="landing-main">
        <section class="landing-copy" aria-labelledby="landing-title">
          <p class="eyebrow">个人世界观察公开入口</p>
          <h1 id="landing-title">把变化放回<br><span>证据里。</span></h1>
          <p class="landing-note">从已归档的来源开始，沿着原文、版本和边界继续看。这里不替你预言下一步。</p>
          <div class="entry-prompt" aria-hidden="true">
            <span class="entry-rule"></span>
            <span class="entry-arrow">↗</span>
            <span>任意处进入完整观察台</span>
          </div>
        </section>

        <aside class="landing-index" aria-label="入口说明">
          <div class="index-rule"></div>
          <p class="index-kicker">ARCHIVE-FIRST</p>
          <p class="index-copy">先读现场<br>再做判断</p>
          <dl class="index-meta">
            <div><dt>入口</dt><dd>公开</dd></div>
            <div><dt>资料</dt><dd>可追溯</dd></div>
            <div><dt>预测</dt><dd>不提供</dd></div>
          </dl>
        </aside>
      </main>

      <footer class="landing-footer">
        <span>OBSERVATION / PERSONAL WORKSPACE</span>
        <span>访问权限由服务端确认</span>
      </footer>
    </div>
    <script src="/landing.js" defer></script>
  </body>
</html>
