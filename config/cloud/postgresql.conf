# Source template; deploy/cloud/postgresql/99-trend-exploring.conf is the
# package-installed copy. Keep loopback and 2 GiB tuning explicit.
listen_addresses = 'localhost'
max_connections = 20
shared_buffers = 128MB
work_mem = 2MB
effective_cache_size = 1GB
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
temp_buffers = 8MB
temp_file_limit = 256MB
