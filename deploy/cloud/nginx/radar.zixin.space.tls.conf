# trend-exploring-managed: nginx __TREND_EXPLORING_DOMAIN__ tls
#
# The HTTP companion is kept in the same site file by install.sh.  Certbot
# must have created the certificate paths before this TLS stage is installed.
# Existing zixin.space and sg.zixin.space server blocks are not touched.

server {
    listen 80;
    listen [::]:80;
    server_name __TREND_EXPLORING_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trend-exploring-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __TREND_EXPLORING_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__TREND_EXPLORING_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TREND_EXPLORING_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:trend_exploring_ssl:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 2m;
    root /opt/trend-exploring/current/app/public;
    access_log /var/log/nginx/trend-exploring.access.log;
    error_log /var/log/nginx/trend-exploring.error.log warn;

    # The application also emits these headers.  Hide its copies so the proxy
    # owns one deterministic public policy rather than returning duplicates.
    proxy_hide_header Server;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Only the deliberately public landing/login assets bypass the backend.
    # app.js/styles.css are intentionally proxied because the backend protects
    # them together with /app; adding a new static file therefore fails closed.
    location = / {
        try_files /landing.html =404;
    }
    location = /landing.html { try_files $uri =404; }
    location = /landing.css { try_files $uri =404; }
    location = /landing.js { try_files $uri =404; }
    location = /login.html { try_files $uri =404; }
    location = /login.css { try_files $uri =404; }
    location = /login.js { try_files $uri =404; }
    location = /assets/landing-hero-v1.webp { try_files $uri =404; }

    # The backend serves /login for GET and accepts the login POST on the same
    # path.  Keeping this as a proxy avoids an unsafe method-based rewrite.
    location = /login { include /etc/nginx/snippets/trend-exploring-proxy.conf; }

    # A public liveness check is intentionally tiny.  Readiness carries DB and
    # queue details and is never an Internet endpoint; operators use
    # 127.0.0.1:3000/api/readyz directly from the host.
    location = /api/livez {
        include /etc/nginx/snippets/trend-exploring-proxy-short.conf;
    }
    location = /api/auth/login {
        client_max_body_size 128k;
        include /etc/nginx/snippets/trend-exploring-proxy-login.conf;
    }
    location = /api/auth/recovery {
        client_max_body_size 128k;
        include /etc/nginx/snippets/trend-exploring-proxy-login.conf;
    }

    # Never let a public request reach the application's detailed readiness
    # response.  Exact locations also cover query strings.
    location = /readyz { return 404; }
    location = /api/readyz { return 404; }

    location / {
        include /etc/nginx/snippets/trend-exploring-proxy.conf;
    }
}
