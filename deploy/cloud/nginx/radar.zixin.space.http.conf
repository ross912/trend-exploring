# trend-exploring-managed: nginx __TREND_EXPLORING_DOMAIN__ bootstrap
#
# This HTTP-only stage is intentionally safe to load before Certbot has issued
# the certificate.  It serves only the ACME webroot and redirects everything
# else to HTTPS; the application is never exposed over cleartext HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __TREND_EXPLORING_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trend-exploring-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
