# Shared reverse-proxy transport and forwarded-request headers for the
# loopback WEBrick upstream. Request-class snippets include this file and
# own their timeout policy so Nginx never sees duplicate proxy_*_timeout
# directives in one location.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
